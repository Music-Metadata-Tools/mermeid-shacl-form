
image: node:20-bullseye

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - node --version
    - npm install typescript
    - npm run build
  artifacts:
    paths:
      - dist/

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
  needs:
    - build